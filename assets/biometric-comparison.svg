<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1000" height="340" rx="16" fill="#090d1e" stroke="#1e293b" stroke-width="1"/>

  <!-- Left: Human Profile -->
  <g transform="translate(40, 30)">
    <rect width="440" height="280" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="440" height="280" rx="12" fill="url(#cardGrid)"/>
    <rect width="440" height="40" rx="12" fill="#065f46" fill-opacity="0.3"/>
    
    <circle cx="25" cy="20" r="6" fill="#10b981"/>
    <text x="40" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">HUMAN USER BIOMETRICS (NORMAL)</text>

    <!-- Simulated Organic Curved Mouse Trajectory -->
    <path d="M 50 200 Q 120 100, 200 160 T 380 90" fill="none" stroke="url(#humanGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="50" cy="200" r="5" fill="#10b981"/>
    <circle cx="380" cy="90" r="5" fill="#06b6d4"/>
    
    <text x="30" y="245" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Curvature Index: <tspan fill="#34d399">0.38 (Organic)</tspan> | Jitter: <tspan fill="#34d399">Normal (35ms)</tspan></text>
    <text x="30" y="265" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Risk Score: <tspan fill="#34d399">0.06 (TRUSTED / GREEN)</tspan></text>
  </g>

  <!-- Right: Bot / Intruder Profile -->
  <g transform="translate(520, 30)">
    <rect width="440" height="280" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="440" height="280" rx="12" fill="url(#cardGrid)"/>
    <rect width="440" height="40" rx="12" fill="#7f1d1d" fill-opacity="0.3"/>
    
    <circle cx="25" cy="20" r="6" fill="#ef4444"/>
    <text x="40" y="25" font-family="sans-serif" font-size="14" font-weight="700" fill="#f87171">BOT ATTACK / SESSION HIJACK (BLOCKED)</text>

    <!-- Simulated Robotic Straight Linear Mouse Trajectory -->
    <line x1="50" y1="210" x2="380" y2="80" stroke="url(#botGrad)" stroke-width="3.5" stroke-linecap="square"/>
    <circle cx="50" cy="210" r="5" fill="#ef4444"/>
    <circle cx="380" cy="80" r="5" fill="#f97316"/>

    <text x="30" y="245" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Straightness: <tspan fill="#ef4444">0.99 (Robotic Linear)</tspan> | Jitter: <tspan fill="#ef4444">0ms (Macro)</tspan></text>
    <text x="30" y="265" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Risk Score: <tspan fill="#ef4444">0.94 (CRITICAL / MFA TRIGGERED)</tspan></text>
  </g>
</svg>
