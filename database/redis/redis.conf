# Redis configuration for development
# Production uses Redis Sentinel for high-availability

bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (AOF for durability)
appendonly yes
appendfilename "aegis-redis.aof"
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Connection limits
maxclients 1000
timeout 300

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
